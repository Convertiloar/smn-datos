name: Actualizar alertas del SMN
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smn
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bajar feed y alertas del SMN
        id: bajar
        # Un corte momentáneo del SMN no es una falla: se reintenta y, si sigue caído, se deja el smn.json anterior
        # (Pronóstico lo acepta hasta 3 h) y la corrida termina bien con un aviso. Solo falla (y manda mail) si el
        # dato publicado ya tiene 3 h o más: ahí sí hay un problema real.
        run: |
          UA="ConvertiloPronostico/1.0 (+https://pronostico.convertilo.com.ar)"
          bajar_feed() {
            for i in 1 2 3; do
              if curl -sS --fail --max-time 30 -A "$UA" -o feed.xml "https://ssl.smn.gob.ar/CAP/AR.php" && grep -q "<channel>" feed.xml; then return 0; fi
              [ "$i" -lt 3 ] && sleep 20
            done
            return 1
          }
          if bajar_feed && python3 - <<'PY'
          import json, re, subprocess, datetime, html, time
          rss = open("feed.xml", encoding="utf-8").read()
          pref = "https://ssl.smn.gob.ar/feeds/CAP/xml_generados/"
          links = []
          for it in re.findall(r"<item>([\s\S]*?)</item>", rss):
              m = re.search(r"<link>([\s\S]*?)</link>", it)
              u = html.unescape(m.group(1).strip()) if m else ""
              if u.startswith(pref) and u.endswith(".xml") and u not in links:
                  links.append(u)
          links = links[:120]
          xmls = {}
          for u in links:
              for intento in range(3):
                  r = subprocess.run(["curl", "-sS", "--fail", "--max-time", "30", "-A", "ConvertiloPronostico/1.0 (+https://pronostico.convertilo.com.ar)", u], capture_output=True, text=True)
                  if r.returncode == 0:
                      break
                  if intento < 2:
                      time.sleep(10)
              else:
                  raise SystemExit("falló una alerta: " + u)
              xmls[u] = r.stdout
          out = {"generado": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "fuente": "Servicio Meteorológico Nacional (CC BY 4.0)", "rss": rss, "xmls": xmls}
          json.dump(out, open("smn.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          then
            echo "publicar=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -- smn.json 2>/dev/null || true
          edad=$(python3 -c "import json,datetime; g=json.load(open('smn.json'))['generado']; d=datetime.datetime.strptime(g,'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc); print(int((datetime.datetime.now(datetime.timezone.utc)-d).total_seconds()//60))" 2>/dev/null || echo 9999)
          if [ "$edad" -lt 180 ]; then
            echo "::warning::El SMN no respondió (3 intentos). Queda el dato anterior, de hace $edad min; se reintenta en la próxima corrida."
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::El SMN no responde y el dato publicado tiene $edad min (3 h o más): revisar."
          exit 1
      - name: Publicar con un solo commit
        if: steps.bajar.outputs.publicar == 'si'
        run: |
          set -e
          git config user.name "smn-datos"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan datos
          git add smn.json .github
          git commit -qm "Alertas SMN $(date -u +%FT%TZ)"
          git push -f origin datos:main
